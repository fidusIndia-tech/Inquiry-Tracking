version: "3.9"

services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./tokens:/app/tokens       # persist tokens across restarts
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    # Windows: --pool=solo   |  Linux production: remove --pool flag (uses prefork)
    command: >
      celery -A workers.celery_app:celery_app worker
      --queues=emails
      --pool=solo
      --loglevel=info
      --concurrency=1
    volumes:
      - .:/app
      - ./tokens:/app/tokens
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A workers.celery_app:celery_app beat --loglevel=info
    volumes:
      - .:/app
      - ./tokens:/app/tokens
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  flower:
    build: .
    command: celery -A workers.celery_app:celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env
    depends_on:
      - redis
